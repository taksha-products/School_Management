# Reverse proxy for EduNex (edunex.taaksha.com).
# HTTP → HTTPS redirect; HTTPS terminates TLS then proxies to frontend/backend.
# Default route: / → /parent/login

# Do not advertise the nginx version.
server_tokens off;

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:5000;
}

# Traccar OsmAnd / HTTP protocol (Traccar Client phone app).
# Keep 5055 private — phones hit HTTPS /osmand on this host instead.
upstream traccar_osmand {
    server traccar:5055;
}

# ACME + redirect to HTTPS
server {
    listen 80;
    server_name edunex.taaksha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edunex.taaksha.com;

    # Let's Encrypt certs (mounted from host — see docker-compose.dev-nginx.yml)
    ssl_certificate     /etc/letsencrypt/live/edunex.taaksha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edunex.taaksha.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Default landing → parent OTP login
    location = / {
        return 302 /parent/login;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location /logos/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    # Traccar Client (OsmAnd): https://edunex.taaksha.com/osmand
    # Trailing slash on proxy_pass strips /osmand so Traccar still sees /?id=&lat=&lon=
    location /osmand/ {
        proxy_pass http://traccar_osmand/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /osmand {
        return 301 /osmand/;
    }

    location / {
        # Security headers for the website. /api, /logos and /socket.io are served by the backend,
        # which already sends its own (helmet); adding them here too would duplicate them, and a
        # doubled X-Frame-Options is ignored by browsers. /osmand is Traccar traffic, not pages.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        proxy_hide_header X-Powered-By;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
