# Staging / prod-like deploy behind nginx + TLS for edunex.taaksha.com
#
# Server .env:
#   DOCKERHUB_USERNAME=takshaproduct
#   IMAGE_TAG=<git-sha>
#   FRONTEND_URL=https://edunex.taaksha.com
#   NEXT_PUBLIC_BACKEND_URL=https://edunex.taaksha.com
#   COOKIE_SECURE=true
#   TRACCAR_URL=http://traccar:8082
#   TRACCAR_TOKEN=...   (or TRACCAR_USER + TRACCAR_PASSWORD)
#   TRACCAR_WEBHOOK_SECRET=...
#
# Traccar Client (phone app) server URL:
#   https://edunex.taaksha.com/osmand
# (nginx proxies to traccar:5055 — no public 5055 port, no Oracle firewall change)
#
# Hardware GPS trackers still need their own protocol port published (not covered by /osmand).
#
# TLS: place Let's Encrypt files on the host (see README steps), then:
#   docker compose -f docker-compose.dev-nginx.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - taksha_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: ${DOCKERHUB_USERNAME}/school-management-backend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OTP_DEBUG: ${OTP_DEBUG:-true}
      # CORS — must match browser origin exactly
      FRONTEND_URL: ${FRONTEND_URL:-https://edunex.taaksha.com}
      # Reach Traccar on the compose network (not localhost)
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
    volumes:
      - taksha_logos:/app/public/logos
    depends_on:
      redis:
        condition: service_healthy

  # GPS: Traccar stays internal. Phones use https://edunex.taaksha.com/osmand
  # (nginx → traccar:5055). Do not publish 5055/8082 on the host.
  traccar:
    image: traccar/traccar:6.17.0
    restart: unless-stopped
    expose:
      - "8082"
      - "5055"
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_ENABLE: "true"
      FORWARD_TYPE: "json"
      FORWARD_URL: ${TRACCAR_FORWARD_URL:-http://backend:5000/api/traccar-webhook/webhook/traccar}?key=${TRACCAR_WEBHOOK_SECRET:-}
    volumes:
      - taksha_traccar_data:/opt/traccar/data
      - taksha_traccar_logs:/opt/traccar/logs
    depends_on:
      - backend

  frontend:
    image: ${DOCKERHUB_USERNAME}/school-management-frontend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://edunex.taaksha.com}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend

  dev-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - traccar

volumes:
  taksha_redis_data:
  taksha_logos:
  taksha_traccar_data:
  taksha_traccar_logs:
