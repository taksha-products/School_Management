# Staging / prod-like deploy behind nginx + TLS for edunex.taaksha.com
#
# Server .env:
#   DOCKERHUB_USERNAME=takshaproduct
#   IMAGE_TAG=<git-sha>
#   FRONTEND_URL=https://edunex.taaksha.com
#   NEXT_PUBLIC_BACKEND_URL=https://edunex.taaksha.com
#   COOKIE_SECURE=true
#
# TLS: place Let's Encrypt files on the host (see README steps), then:
#   docker compose -f docker-compose.dev-nginx.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - taksha_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: ${DOCKERHUB_USERNAME}/school-management-backend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OTP_DEBUG: ${OTP_DEBUG:-false}
      # CORS — must match browser origin exactly
      FRONTEND_URL: ${FRONTEND_URL:-https://edunex.taaksha.com}
    volumes:
      - taksha_logos:/app/public/logos
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME}/school-management-frontend:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://edunex.taaksha.com}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend

  dev-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  taksha_redis_data:
  taksha_logos:
